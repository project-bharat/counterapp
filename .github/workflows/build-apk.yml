name: Android Debug APK

on:
  push:
    branches:
      - main
      - japa-only-cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counterapp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --version

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Name APK and create ZIP package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p artifacts
          APK_NAME="Japa-Counter-Debug-APK-Build-${BUILD_NUMBER}.apk"
          ZIP_NAME="Japa-Counter-Build-${BUILD_NUMBER}.zip"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"
          (
            cd artifacts
            zip -9 "${ZIP_NAME}" "${APK_NAME}"
          )
          test -s "artifacts/${APK_NAME}"
          test -s "artifacts/${ZIP_NAME}"
          ls -lh artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Japa-Counter-Debug-APK-Build-${{ github.run_number }}
          path: artifacts/Japa-Counter-Debug-APK-Build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Japa-Counter-ZIP-Build-${{ github.run_number }}
          path: artifacts/Japa-Counter-Build-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14
